# Prometheus scrape configuration for SailLabel.
#
# Mount this file at /etc/prometheus/prometheus.yml (or include it via
# `scrape_config_files`) in your Prometheus deployment. Adjust `targets` to
# reach whichever host:port exposes Django's /metrics/ endpoint.
#
# The /metrics/ endpoint is unauthenticated; protect it at the network layer
# (ingress rule, private subnet, or basic-auth via the reverse proxy) the same
# way you would for any Prometheus exporter.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: saillabel
    metrics_path: /metrics/
    scheme: http
    static_configs:
      - targets:
          - saillabel-app:8000
        labels:
          service: saillabel
          env: production
