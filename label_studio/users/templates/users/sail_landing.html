{% extends 'simple.html' %}
{% load static %}

{% block page_labeling %}
  <title>SailLabel</title>
  <link href="{{ settings.HOSTNAME }}{% static 'images/favicon.ico' %}" rel="shortcut icon"/>
{% endblock %}

{% block head %}
<style nonce="{{ request.csp_nonce }}">
  html, body { height: 100%; margin: 0; }

  .sail-landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    font-family: 'Hellix', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--color-neutral-content, #1f2937);
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(41, 128, 185, 0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 100%, rgba(20, 184, 166, 0.08), transparent 55%),
      linear-gradient(180deg, #f7fafc 0%, #eef2f7 100%);
    box-sizing: border-box;
  }

  .sail-landing__card {
    width: 100%;
    max-width: 440px;
    background: var(--color-neutral-surface, #ffffff);
    border: 1px solid var(--color-neutral-border, #e5e7eb);
    border-radius: 16px;
    box-shadow:
      0 1px 2px rgba(16, 24, 40, 0.04),
      0 12px 32px rgba(16, 24, 40, 0.08);
    padding: 36px 32px 28px;
    text-align: center;
  }

  .sail-landing__brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .sail-landing__brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(14, 165, 233, 0.25);
  }

  .sail-landing__brand-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #0f172a;
  }

  .sail-landing__brand-name em {
    font-style: normal;
    color: #0369a1;
  }

  .sail-landing__title {
    font-size: 26px;
    font-weight: 600;
    margin: 6px 0 8px;
    letter-spacing: -0.015em;
    color: #0f172a;
  }

  .sail-landing__subtitle {
    font-size: 14px;
    line-height: 1.55;
    color: #475569;
    margin: 0 0 28px;
  }

  .sail-landing__button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    box-shadow: 0 6px 16px rgba(3, 105, 161, 0.25);
  }

  .sail-landing__button:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
    box-shadow: 0 10px 20px rgba(3, 105, 161, 0.3);
  }

  .sail-landing__button:active {
    transform: translateY(0);
    filter: brightness(0.98);
  }

  .sail-landing__hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: #64748b;
  }

  .sail-landing__footer {
    margin-top: 32px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 0.02em;
  }

  @media (prefers-color-scheme: dark) {
    html[data-color-scheme="dark"] .sail-landing {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(56, 189, 248, 0.10), transparent 60%),
        radial-gradient(900px 500px at 100% 100%, rgba(20, 184, 166, 0.08), transparent 55%),
        linear-gradient(180deg, #0b1220 0%, #0a0f1a 100%);
      color: #e2e8f0;
    }

    html[data-color-scheme="dark"] .sail-landing__card {
      background: #111827;
      border-color: #1f2937;
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.2),
        0 18px 40px rgba(0, 0, 0, 0.4);
    }

    html[data-color-scheme="dark"] .sail-landing__brand-name,
    html[data-color-scheme="dark"] .sail-landing__title { color: #f1f5f9; }
    html[data-color-scheme="dark"] .sail-landing__subtitle { color: #94a3b8; }
    html[data-color-scheme="dark"] .sail-landing__hint { color: #94a3b8; }
    html[data-color-scheme="dark"] .sail-landing__footer { color: #475569; }
    html[data-color-scheme="dark"] .sail-landing__brand-name em { color: #38bdf8; }
  }
</style>
{% endblock %}

{% block content %}
<div class="sail-landing">
  <div class="sail-landing__card" role="region" aria-labelledby="sail-landing-title">
    <div class="sail-landing__brand">
      <span class="sail-landing__brand-mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v18"/>
          <path d="M12 4c4 3 7 7 8 14H12"/>
          <path d="M4 20c2-1 4-1.5 8-1.5"/>
        </svg>
      </span>
      <span class="sail-landing__brand-name"><em>Sail</em>Label</span>
    </div>

    <h1 id="sail-landing-title" class="sail-landing__title">Welcome aboard 👋</h1>
    <p class="sail-landing__subtitle">
      조직 계정으로 로그인하여 라벨링 워크스페이스로 이동하세요.
    </p>

    <a href="{{ oidc_login_url }}" class="sail-landing__button" aria-label="Keycloak으로 로그인">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Keycloak 로그인
    </a>

    <p class="sail-landing__hint">SSO를 통해 안전하게 연결됩니다.</p>
  </div>

  <div class="sail-landing__footer">
    SailLabel &middot; Community Edition
  </div>
</div>
{% endblock %}
