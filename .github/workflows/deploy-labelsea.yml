name: "Deploy · Build & push image (label-sea)"

# 수동 실행 전용. Actions 탭에서 "Run workflow" 버튼으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그 (예: latest, v1, 날짜)"
        type: string
        default: "latest"
        required: true
      deploy:
        description: "빌드 후 VM에 자동 배포"
        type: boolean
        default: true

jobs:
  build-push:
    name: "Build on amd64 & push to GHCR"
    runs-on: ubuntu-latest
    permissions:
      contents: read     # 코드 체크아웃
      packages: write    # ghcr.io 로 push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io 이미지 경로는 소문자여야 함: Team-AIVN/label-sea -> team-aivn/label-sea
      - name: Resolve image name (lowercase)
        id: img
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64          # VM(Azure)이 amd64
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.name }}:${{ inputs.tag }}
            ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}
          build-args: |
            BRANCH_OVERRIDE=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 이미지 푸시 완료 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ steps.img.outputs.name }}:${{ inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`ghcr.io/${{ steps.img.outputs.name }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Deploy to Azure VM"
    needs: build-push
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    concurrency: deploy-vm    # 동시 배포 방지
    steps:
      - name: Pull & restart on VM over SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: 20.200.209.213
          VM_USER: label-sea
        run: |
          install -m 600 /dev/null key.pem && printf '%s\n' "$SSH_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" '
            set -e
            cd ~/label-sea
            docker compose pull app
            docker compose up -d
            docker image prune -f
            sleep 20
            docker compose ps
          '
      - name: Health check (public HTTPS)
        run: |
          for i in $(seq 1 10); do
            if curl -sf -o /dev/null https://labelsea.aivn-dev.com/health; then
              echo "HEALTH OK"; exit 0
            fi
            echo "waiting for app... ($i/10)"; sleep 10
          done
          echo "health check failed"; exit 1
      - name: Deploy summary
        run: |
          echo "### VM 배포 완료 ✅ (https://labelsea.aivn-dev.com)" >> "$GITHUB_STEP_SUMMARY"
